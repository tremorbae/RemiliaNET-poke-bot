# RemiliaNET poke bot settings.
# After changing anything here, run ./install_browser.sh to apply it.
# Daily limits start again from zero at midnight.

[pokes]
# Most pokes per day, friends included.
# 0 turns poking off.
per_day = 500

# Poke friends before anyone else: yes or no.
# With no, friends and everyone else are poked in random order.
friends_first = no

# Wait between pokes, in minutes. Each wait is a random time between these two.
# 1 is the shortest possible.
min_minutes_between = 1
max_minutes_between = 2

[friend requests]
# Most friend requests per day. One is sent after poking someone who isn't a friend.
# 0 turns friend requests off.
per_day = 500
